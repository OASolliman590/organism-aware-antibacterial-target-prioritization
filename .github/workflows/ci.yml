name: tests

on:
  push:
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      # TEMPORARY: locating a v2 golden difference between hosts. Remove along
      # with scripts_diag_golden.py once the golden reproduces across machines.
      - name: Diagnose v2 golden
        run: python scripts_diag_golden.py
      - name: Run fast deterministic tests
        run: python -m pytest -q --basetemp=.pytest_tmp
